services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [app-net]

  data-api:
    build: ./data-api
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
    ports:
      - "8081:8081"
    networks: [app-net]

  auth-api:
    build: ./auth-api
    depends_on:
      postgres:
        condition: service_healthy
      data-api:
        condition: service_started
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-must-be-32-bytes-or-more}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal-token-change-me}
      DATA_API_URL: http://data-api:8081
    ports:
      - "8080:8080"
    networks: [app-net]

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
